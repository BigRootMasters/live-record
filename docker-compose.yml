version: '3.8'

x-backend-env: &backend-env
  FLASK_ENV: production
  VIDEO_STORAGE_PATH: /app/data/videos
  SUMMARY_STORAGE_PATH: /app/data/summaries
  FFMPEG_BIN: ${FFMPEG_BIN:-ffmpeg}
  FFPROBE_BIN: ${FFPROBE_BIN:-ffprobe}
  DATABASE_URL: sqlite:////app/data/app.db
  ANCHOR_CONFIG_PATH: /app/config/anchors.json
  USE_REAL_API: ${USE_REAL_API:-True}
  CHECK_INTERVAL: ${CHECK_INTERVAL:-120}
  MAX_RECORDING_DURATION: ${MAX_RECORDING_DURATION:-9000}
  RECORDING_RETENTION_DAYS: ${RECORDING_RETENTION_DAYS:-7}
  CLEANUP_VIDEO: ${CLEANUP_VIDEO:-True}
  ENABLE_TRANSCRIPTION: ${ENABLE_TRANSCRIPTION:-False}
  TRANSCRIPTION_PROVIDER: ${TRANSCRIPTION_PROVIDER:-local}
  TRANSCRIPTION_FALLBACK_PROVIDER: ${TRANSCRIPTION_FALLBACK_PROVIDER:-local}
  AUTO_NOTIFY_ON_TRANSCRIBE: ${AUTO_NOTIFY_ON_TRANSCRIBE:-False}
  OPENAI_API_KEY: ${OPENAI_API_KEY}
  OPENAI_TRANSCRIPTION_MODEL: ${OPENAI_TRANSCRIPTION_MODEL:-gpt-4o-mini-transcribe}
  ALIYUN_DASHSCOPE_API_KEY: ${ALIYUN_DASHSCOPE_API_KEY}
  ALIYUN_PARAFORMER_MODEL: ${ALIYUN_PARAFORMER_MODEL:-paraformer-v2}
  ALIYUN_PARAFORMER_LANGUAGE_HINTS: ${ALIYUN_PARAFORMER_LANGUAGE_HINTS:-zh}
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
  WECHAT_WEBHOOK_URL: ${WECHAT_WEBHOOK_URL}
  WECHAT_TIMEOUT: ${WECHAT_TIMEOUT:-10}
  WECHAT_RETRIES: ${WECHAT_RETRIES:-3}
  AUTO_SEND_AUDIO_ON_RECORDING_COMPLETE: ${AUTO_SEND_AUDIO_ON_RECORDING_COMPLETE:-True}
  WECHAT_AUDIO_BITRATE: ${WECHAT_AUDIO_BITRATE:-16k}
  WECHAT_AUDIO_SAMPLE_RATE: ${WECHAT_AUDIO_SAMPLE_RATE:-16000}
  WECHAT_AUDIO_CHANNELS: ${WECHAT_AUDIO_CHANNELS:-1}
  WECHAT_AUDIO_MAX_MB: ${WECHAT_AUDIO_MAX_MB:-20}
  TRANSCRIPT_BASE_URL: ${TRANSCRIPT_BASE_URL}
  SUMMARY_SEND_TIME: ${SUMMARY_SEND_TIME:-08:00}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

x-backend-build: &backend-build
  context: ./backend
  args:
    APT_MIRROR: ${DOCKER_APT_MIRROR:-https://mirrors.aliyun.com/debian}
    APT_SECURITY_MIRROR: ${DOCKER_APT_SECURITY_MIRROR:-https://mirrors.aliyun.com/debian-security}
    PIP_INDEX_URL: ${DOCKER_PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple/}
    PIP_EXTRA_INDEX_URL: ${DOCKER_PIP_EXTRA_INDEX_URL:-}
    PIP_TRUSTED_HOST: ${DOCKER_PIP_TRUSTED_HOST:-mirrors.aliyun.com}

services:
  backend:
    build: *backend-build
    container_name: live-record-backend
    ports:
      - "5000:5000"
    environment: *backend-env
    volumes:
      - ./backend/data:/app/data
      - ./backend/config:/app/config:ro
    networks:
      - app-network
    restart: unless-stopped

  scheduler:
    build: *backend-build
    container_name: live-record-scheduler
    command: ["python", "run_scheduler.py"]
    environment: *backend-env
    volumes:
      - ./backend/data:/app/data
      - ./backend/config:/app/config:ro
    depends_on:
      - backend
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge
