version: '3.8'

x-backend-env: &backend-env
  FLASK_ENV: production
  VIDEO_STORAGE_PATH: /app/data/recordings
  FFMPEG_BIN: ${FFMPEG_BIN:-ffmpeg}
  FFPROBE_BIN: ${FFPROBE_BIN:-ffprobe}
  DATABASE_URL: sqlite:////app/data/app.db
  ANCHOR_CONFIG_PATH: /app/config/anchors.json
  USE_REAL_API: ${USE_REAL_API:-True}
  CHECK_INTERVAL: ${CHECK_INTERVAL:-120}
  ACTIVE_RECORDING_CHECK_INTERVAL: ${ACTIVE_RECORDING_CHECK_INTERVAL:-30}
  ACTIVE_RECORDING_COOLDOWN_SECONDS: ${ACTIVE_RECORDING_COOLDOWN_SECONDS:-300}
  OFFLINE_CONFIRMATION_CHECKS: ${OFFLINE_CONFIRMATION_CHECKS:-2}
  KEEP_RECORDING_ON_DISCOVERY_ERROR: ${KEEP_RECORDING_ON_DISCOVERY_ERROR:-True}
  MAX_RECORDING_DURATION: ${MAX_RECORDING_DURATION:-9000}
  RECORDING_RETENTION_DAYS: ${RECORDING_RETENTION_DAYS:-7}
  CLEANUP_VIDEO: ${CLEANUP_VIDEO:-False}
  RECORDING_MODE: ${RECORDING_MODE:-audio}
  AUDIO_RECORDING_BITRATE: ${AUDIO_RECORDING_BITRATE:-64k}
  AUDIO_RECORDING_SAMPLE_RATE: ${AUDIO_RECORDING_SAMPLE_RATE:-16000}
  AUDIO_RECORDING_CHANNELS: ${AUDIO_RECORDING_CHANNELS:-1}
  AUTO_DELETE_FAILED_RECORDINGS: ${AUTO_DELETE_FAILED_RECORDINGS:-False}
  MIN_VALID_RECORDING_DURATION_SECONDS: ${MIN_VALID_RECORDING_DURATION_SECONDS:-15}
  FFMPEG_RECONNECT_ENABLED: ${FFMPEG_RECONNECT_ENABLED:-True}
  FFMPEG_RECONNECT_DELAY_MAX_SECONDS: ${FFMPEG_RECONNECT_DELAY_MAX_SECONDS:-10}
  WECHAT_WEBHOOK_URL: ${WECHAT_WEBHOOK_URL}
  WECHAT_TIMEOUT: ${WECHAT_TIMEOUT:-10}
  WECHAT_RETRIES: ${WECHAT_RETRIES:-3}
  AUTO_SEND_AUDIO_ON_RECORDING_COMPLETE: ${AUTO_SEND_AUDIO_ON_RECORDING_COMPLETE:-True}
  WECHAT_AUDIO_BITRATE: ${WECHAT_AUDIO_BITRATE:-16k}
  WECHAT_AUDIO_SAMPLE_RATE: ${WECHAT_AUDIO_SAMPLE_RATE:-16000}
  WECHAT_AUDIO_CHANNELS: ${WECHAT_AUDIO_CHANNELS:-1}
  WECHAT_AUDIO_MAX_MB: ${WECHAT_AUDIO_MAX_MB:-20}
  API_AUTH_TOKEN: ${API_AUTH_TOKEN:-}
  CORS_ORIGINS: ${CORS_ORIGINS:-}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

x-backend-build: &backend-build
  context: ./backend
  args:
    APT_MIRROR: ${DOCKER_APT_MIRROR:-https://mirrors.aliyun.com/debian}
    APT_SECURITY_MIRROR: ${DOCKER_APT_SECURITY_MIRROR:-https://mirrors.aliyun.com/debian-security}
    PIP_INDEX_URL: ${DOCKER_PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple/}
    PIP_EXTRA_INDEX_URL: ${DOCKER_PIP_EXTRA_INDEX_URL:-}
    PIP_TRUSTED_HOST: ${DOCKER_PIP_TRUSTED_HOST:-mirrors.aliyun.com}

services:
  backend:
    build: *backend-build
    container_name: live-record-backend
    ports:
      - "5000:5000"
    environment: *backend-env
    volumes:
      - ./backend/data:/app/data
      - ./backend/config:/app/config:ro
    networks:
      - app-network
    restart: unless-stopped

  scheduler:
    build: *backend-build
    container_name: live-record-scheduler
    command: ["python", "run_scheduler.py"]
    environment: *backend-env
    volumes:
      - ./backend/data:/app/data
      - ./backend/config:/app/config:ro
    depends_on:
      - backend
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge
